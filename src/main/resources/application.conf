# Toutes les valeurs par défaut documentées sont dans reference.conf.
# Modifier ici les paramètres du poste ou utiliser -Dconfig.file=/chemin/local.conf.
app {
  spark { master = "local[2]", shuffle.partitions = 8 }
  optimization { enable-cache = true, enable-broadcast = true }
  data {
    input {
      transactions = "data/transactions.csv"
      users = "data/users.json"
      products = "data/products.parquet"
      merchants = "data/merchants.csv"
    }
    output { path = "output", partitions = 1 }
  }
}
