app {
  name = "EcommerceAnalytics"
  spark { master = "local[2]", shuffle.partitions = 8, timezone = "UTC", log-level = "WARN" }
  optimization {
    enable-cache = true, enable-broadcast = true, auto-broadcast-threshold = -1
    adaptive { enabled = true, coalesce-partitions = true, skew-join = true }
  }
  data {
    input {
      transactions = "data/transactions.csv"
      users = "data/users.json"
      products = "data/products.parquet"
      merchants = "data/merchants.csv"
    }
    output { path = "output", partitions = 1, partitions-large = 1, mode = "overwrite" }
  }
  validation {
    transaction { min-amount-exclusive = 0, timestamp-length = 14, timestamp-pattern = "uuuuMMddHHmmss" }
    user { min-age = 16, max-age = 100, min-income-exclusive = 0 }
    product { min-price-exclusive = 0, min-rating = 1, max-rating = 5 }
    merchant { min-commission = 0, max-commission = 1 }
  }
  time {
    morning-start = 6, afternoon-start = 12, evening-start = 18, night-start = 22
    working-start = 9, working-end-inclusive = 17
    rolling-days = 7, active-days = 5
  }
  age { adult-start = 25, middle-start = 45, senior-start = 65 }
  suspicion { excess-percent = 300, interval-seconds = 300, minimum-flags = 2, payment-method = "CRYPTO" }
  analytics { cohort-target-month = 3, top-products = 10, top-suspicious = 20, preview-rows = 10 }
  report { dashboard = true, top-merchants = 10, retention-columns = 12 }
}
